<!DOCTYPE html>
<html lang="km">
<head>
  <script>(function(){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ចូលប្រើ - HELEN LOAN</title>
  <link rel="icon" type="image/png" href="../images/logo/LOGO.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:    #f1f5f9;
      --card:  #ffffff;
      --text:  #0f172a;
      --muted: #64748b;
      --line:  rgba(148,163,184,.2);
      --accent:#7c5cff;
      --accent2:#06b6d4;
      --err:   #ef4444;
      --inp-bg:#f8fafc;
      --inp-border:rgba(148,163,184,.3);
      --inp-focus:rgba(124,92,255,.5);
      --shadow:0 8px 40px rgba(15,23,42,.10);
    }
    [data-theme="dark"] {
      --bg:    #04060f;
      --card:  rgba(15,23,42,.88);
      --text:  #f1f5f9;
      --muted: #94a3b8;
      --line:  rgba(148,163,184,.14);
      --inp-bg:rgba(255,255,255,.05);
      --inp-border:rgba(148,163,184,.2);
      --shadow:0 8px 40px rgba(0,0,0,.45);
    }
    html, body {
      min-height: 100vh;
      font-family: 'Noto Sans Khmer', 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    [data-theme="dark"] body {
      background: radial-gradient(ellipse at top left, #172554 0%, #090b16 42%, #04060f 100%);
    }
    .wrap {
      width: 100%;
      max-width: 400px;
      padding: 24px 16px calc(24px + env(safe-area-inset-bottom,0px));
    }
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 36px 32px 32px;
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
    }
    [data-theme="dark"] .card {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .logo-img {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      object-fit: contain;
    }
    .logo-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: .04em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo-sub {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      margin-top: -6px;
    }
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: .05em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }
    .field input {
      width: 100%;
      padding: 13px 14px;
      background: var(--inp-bg);
      border: 1.5px solid var(--inp-border);
      border-radius: 12px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--inp-focus);
    }
    .field input::placeholder { color: var(--muted); opacity: .6; }
    .pin-wrap { position: relative; }
    .pin-wrap input { padding-right: 44px; letter-spacing: .1em; }
    .pin-eye {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--muted);
      padding: 4px; line-height: 0;
    }
    .err-box {
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: 10px;
      padding: 10px 13px;
      font-size: 13px;
      color: var(--err);
      margin-bottom: 16px;
      display: none;
    }
    .btn-login {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      transition: .18s;
      box-shadow: 0 4px 20px rgba(124,92,255,.35);
      margin-top: 4px;
      position: relative;
    }
    .btn-login:active { transform: scale(.97); }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; }
    .spin {
      display: none;
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
    }
    @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="logo-wrap">
        <img src="../images/logo/LOGO.png" class="logo-img" alt="HELEN LOAN" onerror="this.style.display='none'">
        <div class="logo-title">HELEN LOAN</div>
        <div class="logo-sub">ចូលគណនីដើម្បីប្រើប្រាស់ប្រព័ន្ធ</div>
      </div>

      <div class="field">
        <label>ឈ្មោះអ្នកប្រើ</label>
        <input id="loginUser" type="text" placeholder="ឈ្មោះ..." autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>
      <div class="field">
        <label>PIN</label>
        <div class="pin-wrap">
          <input id="loginPin" type="password" inputmode="numeric" placeholder="••••" autocomplete="current-password">
          <button class="pin-eye" type="button" onclick="togglePin(this)" title="បង្ហាញ/លាក់ PIN">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="err-box" id="loginErr"></div>

      <button class="btn-login" id="loginBtn" onclick="doLogin()">
        <span id="btnText">ចូលប្រើប្រាស់</span>
        <span class="spin" id="btnSpin"></span>
      </button>
    </div>
  </div>

<script src="../assets/js/api.js?v=8"></script>
<script>
  /* Redirect if already logged in */
  (function() {
    try {
      var a = JSON.parse(localStorage.getItem('helenAuth') || 'null');
      if (a && a.u && a.p) { location.replace('loan-list.html'); }
    } catch(e) {}
  })();

  function togglePin(btn) {
    var inp = document.getElementById('loginPin');
    var isText = inp.type === 'text';
    inp.type = isText ? 'password' : 'text';
    btn.querySelector('svg').style.opacity = isText ? '1' : '.45';
  }

  var _busy = false;
  async function doLogin() {
    if (_busy) return;
    var u = document.getElementById('loginUser').value.trim();
    var p = document.getElementById('loginPin').value.trim();
    var errEl = document.getElementById('loginErr');
    errEl.style.display = 'none';

    if (!u) { showErr('សូមបញ្ចូលឈ្មោះអ្នកប្រើ'); document.getElementById('loginUser').focus(); return; }
    if (!p) { showErr('សូមបញ្ចូល PIN'); document.getElementById('loginPin').focus(); return; }

    _busy = true;
    document.getElementById('loginBtn').disabled = true;
    document.getElementById('btnText').style.opacity = '0';
    document.getElementById('btnSpin').style.display = 'block';

    try {
      var res = await CamboAPI.post({ action: 'helen_login', username: u, pin: p });
      if (res && res.ok) {
        localStorage.setItem('helenAuth', JSON.stringify({ u: u, p: p, name: res.name, role: res.role }));
        var next = new URLSearchParams(location.search).get('next') || 'loan-list.html';
        location.replace(next);
      } else {
        showErr(res && res.message ? res.message : 'ឈ្មោះ ឬ PIN មិនត្រូវ');
      }
    } catch(err) {
      showErr('មិនអាចភ្ជាប់ Server — សូមពិនិត្យ Internet');
    }

    _busy = false;
    document.getElementById('loginBtn').disabled = false;
    document.getElementById('btnText').style.opacity = '1';
    document.getElementById('btnSpin').style.display = 'none';
  }

  function showErr(msg) {
    var el = document.getElementById('loginErr');
    el.textContent = msg;
    el.style.display = 'block';
  }

  /* Enter key submits */
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });
</script>
</body>
</html>
